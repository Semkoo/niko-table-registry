name: Registry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so a new shadcn aria-* style is flagged even without a push.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Track the current Node LTS automatically. Astro 6 requires
          # >= 22.12.0; LTS is already past that floor.
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Every shadcn aria-* style is routed to the React Aria build
        run: node scripts/check-aria-styles.mjs

      - name: Test registry URLs
        run: pnpm test:registry
